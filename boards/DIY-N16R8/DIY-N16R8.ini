; ESP32-S3 DevKitC-1 N16R8 DIY handheld with ST7789 2.0" 240x320 landscape
; TFT (ST7789): SCK=12, MOSI=11, MISO=13, CS=10, DC=15, RST=16, BL=7
; SD: SCK=12, MOSI=11, MISO=13, CS=14
; NRF24: SCK=12, MOSI=11, MISO=13, CSN=38, CE=39
; Buttons: UP=4, DOWN=5, LEFT=6, RIGHT=17, OK=21, BACK=18
; Buzzer: GPIO 2 (PWM)
; Reserved: CC1101 (40/41), IR (42/47), PN532 I2C (8/9/1), Battery ADC (2)

[env:DIY-N16R8]
board = esp32s3
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/DIY-N16R8>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-Iboards/DIY-N16R8

	; ==================== Framework Control Flags ====================
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM=1
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; ==================== Feature gates ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DUSE_HSPI_PORT=1
	-DST7789_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MOSI=11
	-DTFT_MISO=13
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=15
	-DTFT_RST=16
	-DTFT_BL=7
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_INVERSION_ON
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=20000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32-S3 DevKitC-1 N16R8 DIY"'
	-DROTATION=3
	-DBTN_ALIAS='"Ok"'
	-DIR_TX_PINS='{{"Unavailable", -1}}'
	-DIR_RX_PINS='{{"Unavailable", -1}}'
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

	; ==================== SD Card ====================
	-DSD_SCK=12
	-DSD_MISO=13
	-DSD_MOSI=11
	-DSD_CS=14

	; ==================== NRF24 ====================
	-DNRF24_CE=39
	-DNRF24_CSN=38
	-DNRF24_SCK=12
	-DNRF24_MOSI=11
	-DNRF24_MISO=13

	; ==================== Buzzer ====================
	-DBUZZER_PIN=2

lib_deps =
	${env.lib_deps}
